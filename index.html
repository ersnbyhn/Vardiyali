<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 Mesai Takibi - ErsNByhN</title>
  <link rel="apple-touch-icon" href="https://i.ibb.co/mFNgxpdC/icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      padding: 10px;
      display: flex;
      justify-content: center;
      overflow-y: auto;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 50px;
    }

    .hidden {
      display: none !important;
    }

    h2 {
      text-align: center;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 18px;
      color: #0057b8;
    }

    /* --- 1. SAYFA: AYLAR --- */
    .months-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .month-btn {
      height: 44px;
      padding: 0 15px;
      background: #fff;
      border: 2px solid #333;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-radius: 6px;
    }

    .month-btn:active {
      background-color: #e0e0e0;
    }

    .month-hours-badge {
      font-size: 15px;
      font-weight: bold;
      color: #000;
    }

    /* --- 2. SAYFA: TAKVİM VE OTOMASYON --- */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    #backBtn {
      padding: 8px 14px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
      margin-bottom: 4px;
    }

    .weekdays-grid div {
      background: #7f8c8d;
      color: white;
      padding: 6px 0;
      font-size: 12px;
      font-weight: bold;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day-cell {
      min-height: 64px;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    /* Gün (Tarih) Barı - Sadece Not Varsa Yeşil Olur */
    .day-number-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f1f1;
      padding: 2px 0;
      cursor: pointer;
      user-select: none;
    }

    .day-cell.has-note .day-number-bar {
      background-color: #a5d6a7 !important;
    }

    .day-number {
      font-size: 12px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    /* Sarı vardiya inputu (Mesai durumundan bağımsız, hep aynı renk kalır) */
    .day-shift-input {
      width: 100%;
      height: 22px;
      border: none;
      text-align: center;
      font-size: 10px !important;
      font-weight: bold;
      background: #fff3cd;
      outline: none;
      border-bottom: 1px solid #ffeeba;
    }
    
    .day-shift-input::placeholder {
      color: #a08836;
      font-size: 9px;
      font-weight: normal;
    }

    /* Mesai inputu - Standart hali şeffaf/beyaz */
    .day-input {
      width: 100%;
      height: 24px;
      border: none;
      text-align: center;
      font-size: 12px !important;
      font-weight: bold;
      background: transparent;
      outline: none;
    }

    /* Mesai Doldurulduğunda Sadece Mesai Kutusu Yeşil Olur */
    .day-input.has-mesai-val {
      background-color: #c8e6c9 !important;
      color: #155724;
    }

    .day-input::placeholder {
      color: #aaa;
      font-size: 9px;
      font-weight: normal;
    }

    .total-bar {
      margin-top: 15px;
      background: #4caf50;
      color: white;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      border-radius: 4px;
    }

    /* --- NOT MODALI --- */
    #noteModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .modal-content {
      background: #fff;
